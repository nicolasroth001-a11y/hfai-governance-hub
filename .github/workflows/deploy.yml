name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      # Repackage the HFAI Guard Chrome extension fresh from source
      # so public/hfai-guard.zip is never stale.
      - name: Package HFAI Guard extension
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          rm -f public/hfai-guard.zip
          cd extension-guard && zip -r ../public/hfai-guard.zip . && cd ..
          ls -la public/hfai-guard.zip

      - run: npm run build
      - run: node scripts/generate-static-shells.js

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
