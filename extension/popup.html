<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; width: 320px; margin: 0; padding: 16px; background: #0a0a0a; color: #f5f5f5; }
  h1 { font-size: 14px; margin: 0 0 12px; color: #c4993a; letter-spacing: 0.5px; }
  label { display: block; font-size: 11px; color: #999; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  input { width: 100%; padding: 8px; background: #1a1a1a; border: 1px solid #333; color: #f5f5f5; border-radius: 4px; box-sizing: border-box; font-size: 12px; }
  button { width: 100%; padding: 10px; background: #c4993a; color: #000; border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 12px; font-size: 13px; }
  button.secondary { background: #1a1a1a; color: #f5f5f5; border: 1px solid #333; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { padding: 10px; background: #1a1a1a; border-radius: 4px; font-size: 11px; margin-top: 12px; line-height: 1.6; }
  .row { display: flex; justify-content: space-between; }
  .row span:last-child { color: #c4993a; font-weight: 600; }
  .hint { font-size: 10px; color: #666; margin-top: 8px; line-height: 1.5; }
  .danger { color: #ef4444; }
  .ok { color: #10b981; }
</style>
</head>
<body>
  <h1>🛡️ HFAI Outreach</h1>

  <label>Extension token</label>
  <input id="token" type="password" placeholder="hflin_..." />

  <label>Daily cap (max 20 recommended)</label>
  <input id="cap" type="number" min="1" max="25" value="15" />

  <button id="save">Save & verify</button>
  <button id="start" class="secondary">Start auto-session</button>
  <button id="stop" class="secondary">Stop</button>

  <div class="status" id="status">Not connected.</div>

  <div class="hint">
    1. Save your token (from /admin/leads)<br>
    2. Open linkedin.com and stay logged in<br>
    3. Click Start — extension will visit prospects, send personalized requests with random 45-90s delays<br>
    4. Stops automatically at daily cap
  </div>
</body>
<script src="popup.js"></script>
</html>
